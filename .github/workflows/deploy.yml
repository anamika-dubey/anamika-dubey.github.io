name: deploy

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    # available images: https://github.com/actions/runner-images#available-images
    runs-on: ubuntu-latest
    steps:
    - name: Checkout 🛎️
      uses: actions/checkout@v3
    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2.2'
        bundler-cache: true
    - name: Update _config.yml ⚙️
      uses: fjogeleit/yaml-update-action@v0.13.1
      with:
        commitChange: false
        valueFile: '_config.yml'
        propertyPath: 'giscus.repo'
        value: ${{ github.repository }}
    - name: Install and Build 🔧
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PREVIEW_PR_URL: ${{ github.event.pull_request.html_url }}
      run: |
        pip3 install --upgrade jupyter
        npm install -g mermaid.cli
        npm install -g purgecss
        export JEKYLL_ENV=production
        if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
          printf 'preview: true\npreview_pr_url: "%s"\n' "$PREVIEW_PR_URL" > _config_preview.yml
          bundle exec jekyll build --lsi --baseurl "/previews/pr-$PR_NUMBER" --config _config.yml,_config_preview.yml
        else
          bundle exec jekyll build --lsi
        fi
        purgecss -c purgecss.config.js
    - name: Deploy 🚀
      if: github.event_name != 'pull_request'
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: _site
        clean-exclude: previews/**
    - name: Publish pull request preview
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: _site
        target-folder: previews/pr-${{ github.event.pull_request.number }}
        force: false
        commit-message: Publish preview for PR ${{ github.event.pull_request.number }}
    - name: Preview link
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        echo "### Website preview" >> "$GITHUB_STEP_SUMMARY"
        echo "[View the People page](https://anamika-dubey.github.io/previews/pr-$PR_NUMBER/people/)" >> "$GITHUB_STEP_SUMMARY"


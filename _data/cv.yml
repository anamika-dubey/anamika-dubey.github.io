- title: Research and Teaching Interests
  type: nested_list
  contents:
    - title: Power system modeling, optimization, and learning
      items:
        - Physics-consistent optimization and coordination of active distribution systems and grid-edge resources
        - Grid resilience through hazard and vulnerability modeling, risk-averse planning, and distributed operations
        - Scalable computational methods for grid analytics and decision-making under uncertainty
        - Regional power-system models and cross-domain studies of extreme weather, reliability, and load growth

